services:
  # Redis for API Gateway rate limiting
  redis:
    image: redis:7-alpine
    container_name: oar-dds-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  # PostgreSQL Database for cache-mgmt service
  postgres:
    image: postgres:15-alpine
    container_name: oar-dds-postgres
    environment:
      POSTGRES_USER: oar_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test123}
      POSTGRES_DB: oar_cache
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oar_app -d oar_cache"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  # Spring Cloud Config Server
  # Requires setup first: cd config-server && ./setup-config.sh
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: oar-dds-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - network

  # Eureka Service Discovery Server
  oar-dds-eureka:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: oar-dds-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - network

  # Dataset Access Service
  dataset-access:
    build:
      context: ./services/dataset-access
      dockerfile: Dockerfile
    container_name: oar-dds-dataset-access
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
    volumes:
      - ./test-data:/data/oar-dds/bags  # Bind mount for testing
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
    networks:
      - network

  # AIP Access Service
  aip-access:
    build:
      context: ./services/aip-access
      dockerfile: Dockerfile
    container_name: oar-dds-aip-access
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
    volumes:
      - ./test-data:/data/oar-dds/bags  # Bind mount for testing
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
    networks:
      - network

  # Bundle Plan Service
  bundle-plan:
    build:
      context: ./services/bundle-plan
      dockerfile: Dockerfile
    container_name: oar-dds-bundle-plan
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=oar_bundle_plan
      - POSTGRES_USER=oar_app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test123}
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - network

  # Data Bundle Service
  data-bundle:
    build:
      context: ./services/data-bundle
      dockerfile: Dockerfile
    container_name: oar-dds-data-bundle
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
    networks:
      - network

  # Cache Management Service
  cache-mgmt:
    build:
      context: ./services/cache-mgmt
      dockerfile: Dockerfile
    container_name: oar-dds-cache-mgmt
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=oar_cache
      - POSTGRES_USER=oar_app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test123}
    volumes:
      - ./test-data:/data/oar-dds/bags  # Bind mount for testing (preservation storage)
      - ./test-data/cache:/data/oar-dds/cache  # Cache admin directory
      - cache-data:/data/ds  # Docker volume for cache storage
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - network

  # Restricted Access Service
  restricted-access:
    build:
      context: ./services/restricted-access
      dockerfile: Dockerfile
    container_name: oar-dds-restricted-access
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test123}
    volumes:
      - bag-storage-data:/usr/local/oar-dist-service/data
      - rpa-cache-data:/data/rpa
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - network

  # Version Service
  version-service:
    build:
      context: ./services/version-service
      dockerfile: Dockerfile
    container_name: oar-dds-version-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
    networks:
      - network

  # API Gateway
  api-gateway:
    build:
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: oar-dds-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - CONFIG_SERVER_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://oar-dds-eureka:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      oar-dds-eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - network

  # Demo UI - Angular Material Dashboard
  demo-ui:
    build:
      context: ./demo-ui
      dockerfile: Dockerfile
    container_name: oar-dds-demo-ui
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
      - oar-dds-eureka
      - cache-mgmt
      - dataset-access
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  postgres-data:
  bag-storage-data:
  cache-data:
  rpa-cache-data:
