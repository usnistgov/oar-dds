server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        # Native profile - reads config files from classpath (src/main/resources/config/)
        native:
          search-locations: classpath:/config/

# Eureka client configuration - disabled for config server (infrastructure component)
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.config: INFO
    root: INFO
