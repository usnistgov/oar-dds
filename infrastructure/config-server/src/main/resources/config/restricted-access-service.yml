spring:
  application:
    name: restricted-access-service

server:
  port: 8086

# Restricted Public Access Configuration
distrib:
  # Cache mode: 'local' for local cache (development), 'remote' for cache-mgmt service (production)
  cache:
    mode: remote

  rpa:
    bagstore-location: /usr/local/oar-dist-service/data
    bagstore-mode: local
    headbagCacheSize: 50000000
    baseDownloadUrl: http://localhost:8080/od/ds
    pdrCachingUrl: http://localhost:8080
    resolverUrl: http://localhost:8090
    datacartUrl: http://localhost:3000
    smeAppUrl: http://localhost:4200
    jwtSecretKey: ${JWT_SECRET_KEY:test-secret-key-change-in-production}
    expiresAfterMillis: 86400000  # 24 hours
    supportEmail: datasupport@nist.gov

  # Cache Manager Configuration
  cachemgr:
    admindir: /data/rpa
    headbagCacheSize: 50000000
    smallSizeLimit: 5000000
    volumes:
      - name: rpa0
        roles:
          - restricted
        location: file://vols/rpa0
        capacity: 120000000
