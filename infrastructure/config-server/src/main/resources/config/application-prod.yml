# Common configuration for PROD profile (all services)
# Production environment

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

# Production logging - minimal verbosity
logging:
  level:
    root: WARN
    gov.nist.oar: INFO
    org.springframework.web: WARN
    org.springframework.cloud: WARN

# Minimal error details in production
server:
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

# Actuator - expose only essential endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

# Distributed tracing - sample 10% in production
management.tracing:
  sampling:
    probability: 0.1

# Stricter circuit breaker settings for production
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 40
        wait-duration-in-open-state: 30s
