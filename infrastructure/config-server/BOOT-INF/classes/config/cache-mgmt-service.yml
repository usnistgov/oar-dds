spring:
  application:
    name: cache-mgmt-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:oar_cache}
    username: ${POSTGRES_USER:oar_app}
    password: ${POSTGRES_PASSWORD:test123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8085

# Cache Manager Configuration
distrib:
  cachemgr:
    admindir: /data/ds
    headbagCacheSize: 50000000
    smallSizeLimit: 5000000
    monitorAutoStart: true
    triggerCache: false
    restapi:
      accesstoken: ${CACHE_API_TOKEN:LOCALTOKEN}
    dbtype: postgres
    dburl: //localhost:5432/oar_cache?user=oar_app&password=${POSTGRES_PASSWORD:test123}
    
    # Cache Volumes Configuration
    volumes:
      - name: fst0
        roles:
          - small
          - fast
        location: file://vols/fst0
        capacity: 120000000
        redirectBase: https://localhost/cch/fst0/
      
      - name: fst1
        roles:
          - small
          - fast
        location: file://vols/fst1
        capacity: 120000000
      
      - name: gen0
        roles:
          - large
          - general
        location: file://vols/gen0
        capacity: 120000000
      
      - name: gen1
        roles:
          - large
          - general
        location: file://vols/gen1
        capacity: 120000000
      
      - name: old0
        roles:
          - old
        location: file://vols/old0
        capacity: 120000000
      
      - name: rpd
        roles:
          - restricted
        location: file://vols/rpd
        capacity: 120000000
      
      - name: oldrpd
        roles:
          - old-restricted
        location: file://vols/oldrpd
        capacity: 120000000
